# IMPORTANT: 
#   1. a traefik v3 container needs to be running on the `proxy` network. change the name if you want.
#   2. generate env file: python3 ./scripts/generate-prod-env.py
#   3. start: docker compose -f docker-compose.prod.yaml --env-file .env.prod up -d

name: wersu-prod
services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg18-trixie
    container_name: wersu-postgres
    restart: always
    env_file: ./.env.prod
    volumes:
      - ../data/pgvector:/var/lib/postgresql
      - ./pgvector_init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # $$ escapes compose interpolation: the rendered test becomes
      # `psql -U $POSTGRES_USER -d $POSTGRES_DB ...`, which the
      # container's shell expands from env_file at healthcheck time.
      test:
        - CMD-SHELL
        - psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c 'SELECT 1'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  spicedb-migrate:
    image: authzed/spicedb:latest
    container_name: wersu-spicedb-migrate
    env_file: ./.env.prod
    command:
      - datastore
      - migrate
      - head
      - --datastore-engine=postgres
      - --datastore-conn-uri=postgres://spicedb:${SPICEDB_PASSWORD}@postgres:5432/spicedb?sslmode=disable
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  spicedb:
    image: authzed/spicedb:latest
    container_name: wersu-spicedb
    restart: always
    env_file: ./.env.prod
    command:
      - serve
      - --http-enabled=false
      - --grpc-preshared-key=${GRPC_SPICEDB_CREDENTIALS}
      - --datastore-engine=postgres
      - --datastore-conn-uri=postgres://spicedb:${SPICEDB_PASSWORD}@postgres:5432/spicedb?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      spicedb-migrate:
        condition: service_completed_successfully
    networks:
      - internal

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: wersu-garage
    restart: always
    env_file: ./.env.prod
    command:
      - /garage
      - server
    volumes:
      - ./infrastructure/garage.toml:/etc/garage.toml:ro
      - ../data/garage/meta:/tmp/meta
      - ../data/garage/data:/tmp/data
    networks:
      - internal

  imgproxy:
    # Internal-only: wersu-rest talks to it over the docker network
    # at http://imgproxy:8080. No Traefik route, no proxy network.
    image: ghcr.io/imgproxy/imgproxy:latest
    container_name: wersu-imgproxy
    env_file: ./.env.prod
    depends_on:
      - garage
    restart: always
    networks:
      - internal

  wersu-grpc:
    image: docker.io/kuramasyu/wersu-grpc:${IMAGE_TAG:-dev}
    container_name: wersu-grpc
    restart: always
    env_file: ./.env.prod
    depends_on:
      postgres:
        condition: service_healthy
      spicedb:
        condition: service_started
    networks:
      - internal

  wersu-rest:
    image: docker.io/kuramasyu/wersu-rest:${IMAGE_TAG:-dev}
    container_name: wersu-rest
    restart: always
    env_file: ./.env.prod
    depends_on:
      - wersu-grpc
      - postgres
      - spicedb
      - garage
    networks:
      - internal
      - proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.wersu-rest.entrypoints: websecure
      traefik.http.routers.wersu-rest.rule: Host(`wersu-api.${DOMAIN}`)
      traefik.http.services.wersu-rest.loadbalancer.server.port: "8080"


  wersu-web-app:
    image: docker.io/kuramasyu/wersu-web-app:${IMAGE_TAG:-dev}
    container_name: wersu-web-app
    restart: always
    env_file: ./.env.prod
    depends_on:
      - wersu-rest
    networks:
      - internal
      - proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.wersu-web.entrypoints: websecure
      traefik.http.routers.wersu-web.rule: Host(`wersu.${DOMAIN}`)
      traefik.http.services.wersu-web.loadbalancer.server.port: "5173"
      # Auto update with watchtower
      com.centurylinklabs.watchtower.enable: "true"


  hocuspocus:
    build:
      context: ./infrastructure/hocuspocus
      dockerfile: Dockerfile
    container_name: wersu-hocuspocus
    restart: always
    env_file: ./.env.prod
    depends_on:
      - spicedb
    networks:
      - internal
      - proxy
    # WS -> WSS: the `websecure` entrypoint terminates TLS; Traefik
    # passes the WebSocket Upgrade/Connection headers through to the
    # hocuspocus backend on port 8666. No extra middleware is needed.
    labels:
      traefik.enable: "true"
      traefik.http.routers.wersu-hocuspocus.entrypoints: websecure
      traefik.http.routers.wersu-hocuspocus.rule: Host(`wersu-ws.${DOMAIN}`)
      traefik.http.services.wersu-hocuspocus.loadbalancer.server.port: "8666"

networks:
  proxy:
    external: true
  internal:
    name: wersu-internal
