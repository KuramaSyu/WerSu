syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

package proto;
option go_package = "github.com/KuramaSyu/WerSu-Rest/src/proto;proto";

// A role that bundles a set of users for permission grants.
//
// Metadata (name, description) lives in Postgres.  Membership edges
// (`user#member_of@role`) live in SpiceDB.
message Role {
    string id = 1;
    string name = 2;
    string description = 3;
    google.protobuf.Timestamp created_at = 4;
}

// A single `user#member_of@role` edge.
message UserRoleMembership {
    string user_id = 1;
    string role_id = 2;
    google.protobuf.Timestamp granted_at = 3;
}

// Filter for searching roles.
//
// `member_id` matches roles whose SpiceDB `user#member_of@role`
// relation includes the given user id.  `name` matches by exact
// role name.  Both fields are optional; unset means "don't filter
// on that field".
message RoleFilter {
    optional string name = 1;
    optional string member_id = 2;
}

// Create a new role.  The actor's user_id is used for permission
// checks (currently: must hold `manage` on the bootstrap role).
message CreateRoleRequest {
    string user_id = 1;
    string name = 2;
    string description = 3;
}

// Update a role's metadata (name and/or description).  Membership
// is managed through `AddUserToRole` / `RemoveUserFromRole`.  The
// actor's user_id is used for permission checks.
message UpdateRoleRequest {
    string user_id = 1;
    string id = 2;
    optional string name = 3;
    string description = 4;
}

// Delete a role.  Membership edges become dangling references in
// SpiceDB (they silently evaluate to nothing); cleanup of those is
// the caller's responsibility.  The actor's user_id is used for
// permission checks.
message DeleteRoleRequest {
    string user_id = 1;
    string id = 2;
}

message GetRoleRequest {
    string user_id = 1;
    string id = 2;
}

message GetRolesRequest {
    string user_id = 1;
    RoleFilter filter = 2;
}

// Add a user to a role's membership.  Gated by `manage` permission
// on the role.
message AddUserToRoleRequest {
    string user_id = 1;
    string role_id = 2;
    string subject_user_id = 3;
}

// Remove a user from a role's membership.  Gated by `manage`
// permission on the role.
message RemoveUserFromRoleRequest {
    string user_id = 1;
    string role_id = 2;
    string subject_user_id = 3;
}

// List every role the given user is a member of.
message GetRolesForUserRequest {
    string user_id = 1;
    string subject_user_id = 2;
}

// List every user that is a member of the given role.
message GetUsersForRoleRequest {
    string user_id = 1;
    string role_id = 2;
}

service RoleService {
    rpc CreateRole(CreateRoleRequest) returns (Role);
    rpc UpdateRole(UpdateRoleRequest) returns (Role);
    rpc DeleteRole(DeleteRoleRequest) returns (google.protobuf.Empty);
    rpc GetRole(GetRoleRequest) returns (Role);
    rpc GetRoles(GetRolesRequest) returns (stream Role);

    rpc AddUserToRole(AddUserToRoleRequest) returns (UserRoleMembership);
    rpc RemoveUserFromRole(RemoveUserFromRoleRequest) returns (google.protobuf.Empty);
    rpc GetRolesForUser(GetRolesForUserRequest) returns (stream Role);
    rpc GetUsersForRole(GetUsersForRoleRequest) returns (stream UserRoleMembership);
}