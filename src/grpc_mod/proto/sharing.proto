syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

package proto;
option go_package = "github.com/KuramaSyu/Wersu-Rest/src/proto;proto";


// String wrapper: field omitted = leave unchanged, null_value = explicit NULL,
// value = use the provided string.
message NullableString {
    oneof kind {
        string value = 1;
        bool null_value = 2;
    }
}

// Timestamp wrapper: field omitted = leave unchanged, null_value = explicit NULL,
// value = use the provided timestamp.
message NullableTimestamp {
    oneof kind {
        google.protobuf.Timestamp value = 1;
        bool null_value = 2;
    }
}


// Permission level of a share.
enum SharePermission {
    SHARE_PERMISSION_UNSPECIFIED = 0;
    SHARE_PERMISSION_READ = 1;
    SHARE_PERMISSION_WRITE = 2;
}

// A persisted share entry for a note.
message NoteShare {
    string id = 1;
    NullableString description = 2;
    string note_id = 3;
    google.protobuf.Timestamp created_at = 4;
    string created_by = 5;
    NullableTimestamp online_since = 6;
    NullableTimestamp online_until = 7;
    SharePermission permission = 8;
    string access_as = 9;
}

// Filter for shares. Dates are inclusive:
// online_since.value matches online_since >= value, online_until.value matches
// online_until <= value, null_value matches rows where the column is NULL.
message ShareFilter {
    optional string note_id = 1;
    optional string created_by = 2;
    NullableTimestamp online_since = 3;
    NullableTimestamp online_until = 4;
}

// Create one share. The requester user_id is used for permission checks.
message CreateShareRequest {
    string user_id = 1;
    NullableString description = 2;
    string note_id = 3;
    NullableTimestamp online_since = 4;
    NullableTimestamp online_until = 5;
    SharePermission permission = 6;
}

// Access a share by its ID (the share_id segment of /public/n/<share_id>).
message AccessShareRequest {
    string share_id = 1;
}

// Response for an access share request, containing the note associated with the share
message AccessShareResponse {
    NoteShare share = 1;
}

// Look up the temporary user id used to access a share.
message GetShareUserRequest {
    string share_id = 1;
}

// Response carrying the temporary user id for a share.
message GetShareUserResponse {
    string access_as = 1;
    NullableTimestamp online_until = 2;
}


// Update one share. Only fields present on share should be updated.
// The requester user_id is used for permission checks.
message UpdateShareRequest {
    string user_id = 1;
    NoteShare share = 2;
}

// Fetch shares by their exact share IDs.
// The requester user_id is used for permission checks.
message GetSharesByIdRequest {
    string user_id = 1;
    repeated string share_ids = 2;
}

// Fetch shares matching a filter.
// The requester user_id is used for permission checks.
message GetSharesRequest {
    string user_id = 1;
    ShareFilter filter = 2;
}

// Delete shares by their exact share IDs.
// The requester user_id is used for permission checks.
message DeleteSharesRequest {
    string user_id = 1;
    repeated string share_ids = 2;
}

service SharingService {
    rpc CreateShare(CreateShareRequest) returns (NoteShare);
    rpc UpdateShare(UpdateShareRequest) returns (NoteShare);
    rpc GetSharesById(GetSharesByIdRequest) returns (stream NoteShare);
    rpc GetShares(GetSharesRequest) returns (stream NoteShare);
    rpc DeleteShares(DeleteSharesRequest) returns (google.protobuf.Empty);

    rpc AccessShare(AccessShareRequest) returns (AccessShareResponse);
    rpc GetShareUser(GetShareUserRequest) returns (GetShareUserResponse);
}
