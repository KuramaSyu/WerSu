syntax = "proto3";

package proto;
option go_package = "github.com/KuramaSyu/WerSu-Rest/src/proto;proto";

// User Messages
message User {
    string id = 1;
    int64 discord_id = 2;
    string avatar= 3;
    string username = 4;
    string discriminator = 5;
    string email = 6;

}

message GetUserRequest {
    optional string id = 1;
    optional int64 discord_id = 2;
}

message PostUserRequest {
    int64 discord_id = 1;
    string avatar = 2;
    string username = 3;
    string discriminator = 4;
    string email = 5;
}

message AlterUserRequest {
    string id = 1;
    optional int64 discord_id = 2;
    optional string avatar = 3;
    optional string username = 4;
    optional string discriminator = 5;
    optional string email = 6;
}

message DeleteUserRequest {
    string id = 1;
}

message DeleteUserResponse {
    bool success = 1;
}

// Search users by id / username / email.
message SearchUserRequest {
    // Free-form query, interpreted by shape:
    //   * contains "@" -> exact email match
    //   * otherwise     -> fuzzy username match, or partial id match
    string query = 1;

    // id of the user performing the search (the caller's user context)
    string user_id = 2;
}

message SearchUserResponse {
    // at most the first 10 matching users
    repeated User users = 1;
}

// Fetch many users by id in one round-trip.
message GetUsersRequest {
    // id of the user performing the lookup (the caller's user context)
    string user_id = 1;

    // ids of the users to load; unknown ids are omitted from the reply
    repeated string ids = 2;
}

message GetUsersResponse {
    // the users that exist, in the order of GetUsersRequest.ids
    repeated User users = 1;
}

// User Service
service UserService {
    rpc GetUser(GetUserRequest) returns (User);
    rpc PostUser(PostUserRequest) returns (User);
    rpc AlterUser(AlterUserRequest) returns (User);
    rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
    rpc SearchUser(SearchUserRequest) returns (SearchUserResponse);
    rpc GetUsers(GetUsersRequest) returns (GetUsersResponse);
}