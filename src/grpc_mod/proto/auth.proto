syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

package proto;
option go_package = "github.com/KuramaSyu/Wersu-Rest/src/proto;proto";

// Auth service.
//
// Layering:
// - The browser talks to REST (WerSu-Rest), not gRPC. REST is the HTTP edge
//   and runs the WebAuthn ceremony (challenge, attestation, assertion) with
//   go-webauthn. It also handles password hashing, rate limiting, JWT issuance,
//   and email delivery.
// - gRPC is the source of truth for users and credentials. REST calls into this
//   service to look up credentials, persist public keys, and bump counters.
// - There is no session table. Every gRPC request is trusted because the REST
//   middleware has already verified a JWT or session.

enum CredentialKind {
    CREDENTIAL_KIND_UNSPECIFIED = 0;
    CREDENTIAL_KIND_DISCORD = 1;
    CREDENTIAL_KIND_PASSWORD = 2;
    CREDENTIAL_KIND_PASSKEY = 3;
    CREDENTIAL_KIND_GOOGLE = 4;
}

// User as exposed to the auth layer.
message UserAuth {
    string id = 1;
    string email = 2;
    // Username is optional; empty string means unset.
    string username = 3;
    // Zero timestamp means the email has not been verified yet.
    google.protobuf.Timestamp email_verified_at = 4;
    bool is_active = 5;
    google.protobuf.Timestamp created_at = 6;
    // Absolute avatar URL. Empty string means none; REST maps empty to JSON null.
    string avatar_url = 7;
}

// Stored credential. Exactly one payload oneof field is populated
// (enforced by the service layer); kind tells REST which one to read.
message Credential {
    string id = 1;
    string user_id = 2;
    CredentialKind kind = 3;
    google.protobuf.Timestamp created_at = 4;
    google.protobuf.Timestamp last_used_at = 5;

    oneof payload {
        // kind = DISCORD
        string discord_id = 6;

        // kind = PASSWORD; argon2id encoded string
        string password_hash = 7;

        // kind = PASSKEY; points at the row in passkeys table
        string passkey_id = 8;

        // kind = GOOGLE; Google's stable user id from the sub claim
        string google_id = 9;
    }
}

// Stored WebAuthn passkey (public-key credential).
// The private key never leaves the user's device. public_key holds the
// COSE-encoded public key produced at registration. sign_count is bumped
// on every successful login and must strictly increase; a non-monotonic
// counter suggests an authenticator clone.
message Passkey {
    string id = 1;
    string user_id = 2;
    bytes credential_id = 3;
    bytes public_key = 4;
    uint64 sign_count = 5;
    repeated string transports = 6;
    bytes aaguid = 7;
    bool backup_eligible = 8;
    bool backup_state = 9;
    bool user_verified = 10;
    string friendly_name = 11;
    google.protobuf.Timestamp created_at = 12;
    google.protobuf.Timestamp last_used_at = 13;
    google.protobuf.Timestamp revoked_at = 14;
}

// Lookup a user by id/email/discord id.
// Often used by frontend: useUser() hook resolves to this.
// REST takes user id from session and checks against this endpoint.
message GetUserAuthRequest {
    oneof identifier {
        string user_id = 1;
        string email = 2;
        int64 discord_id = 3;
    }
}

message GetUserAuthResponse {
    UserAuth user = 1;
}

// Create a user (email + password signup).
// Returns ALREADY_EXISTS if a user with the email already exists.
message CreateUserAuthRequest {
    string email = 1;
    string username = 2;
    string password_hash = 3;
    // Optional. Absolute avatar URL resolved by REST via Discord/Google/Gravatar.
    // Empty string means none; frontend maps empty to JSON null.
    string avatar_url = 4;
}

message CreateUserAuthResponse {
    UserAuth user = 1;
}

// Update mutable fields on a user. Each field is tri-state:
// omitted (leave unchanged), _set (write value), or _clear (set column NULL).
// Used for username/email changes and email_verified_at.
message UpdateUserAuthRequest {
    string user_id = 1;

    // actor used for permission checks
    string requester_id = 2;

    oneof username_change {
        string username_set = 3;
        google.protobuf.Empty username_clear = 4;
    }

    oneof email_change {
        string email_set = 5;
        google.protobuf.Empty email_clear = 6;
    }

    oneof email_verified_change {
        google.protobuf.Timestamp email_verified_at_set = 7;
        google.protobuf.Empty email_verified_at_clear = 8;
    }

    oneof avatar_url_change {
        string avatar_url_set = 9;
        google.protobuf.Empty avatar_url_clear = 10;
    }
}

message UpdateUserAuthResponse {
    UserAuth user = 1;
}


// Search a user by email/discord id/google id
message FindCredentialByProviderRequest {
    oneof identifier {
        int64 discord_id = 1;
        string email = 2;
        string google_id = 3;
    }
    CredentialKind kind = 4;
}

message FindCredentialByProviderResponse {
    Credential credential = 1;
    UserAuth user = 2;
}

// Look up a passkey by its WebAuthn credential id. REST calls this with
// the id from navigator.credentials.get() so it can verify the signature
// with the right public key.
message FindPasskeyRequest {
    bytes credential_id = 1;
}

message FindPasskeyResponse {
    Passkey passkey = 1;
}

// List a user's passkeys for the settings page (friendly label, last-used date, revoke).
message ListPasskeysRequest {
    string user_id = 1;
    bool include_revoked = 2;
}

message ListPasskeysResponse {
    repeated Passkey passkeys = 1;
}

// Bump the sign counter after a successful assertion. REST verifies the
// signature first, then calls this. Returns FAILED_PRECONDITION if the new
// counter is not strictly greater than the stored one (cloned authenticator).
message UpdatePasskeyCounterRequest {
    string passkey_id = 1;
    uint64 new_sign_count = 2;
}

message UpdatePasskeyCounterResponse {
    Passkey passkey = 1;
}

// Store a new passkey after REST has verified the attestation.
// credential_id is the raw bytes from the authenticator; public_key is the
// COSE-encoded public key extracted from the attestation authData.
// The service stores both in their native byte form; they are not reshaped.
message RegisterPasskeyRequest {
    string user_id = 1;

    // actor used for permission checks
    string requester_id = 2;
    bytes credential_id = 3;
    bytes public_key = 4;
    repeated string transports = 5;
    bytes aaguid = 6;
    bool backup_eligible = 7;
    bool backup_state = 8;
    bool user_verified = 9;
    string friendly_name = 10;
}

message RegisterPasskeyResponse {
    Passkey passkey = 1;
}

message RevokePasskeyRequest {
    string passkey_id = 1;
    string user_id = 2;
    string requester_id = 3;
}


// Account Linking: attach a new credential to an existing user
// (Passkey, Discord OAuth, Google OAuth, or password).
// kind selects which payload field is populated; exactly one of
// discord_id, password_hash, passkey_id, or google_id must be set.
// Returns ALREADY_EXISTS if the user already has a credential of that kind
// (passkey is the exception and can have many).
message LinkCredentialRequest {
    string user_id = 1;
    string requester_id = 2;
    CredentialKind kind = 3;

    oneof payload {
        string discord_id = 4;
        string password_hash = 5;
        string passkey_id = 6;
        string google_id = 7;
    }
}

message LinkCredentialResponse {
    Credential credential = 1;
}

// Unlink a credential. Removing the last credential should raise.
message UnlinkCredentialRequest {
    string credential_id = 1;
    string user_id = 2;

    // the actor on which we will check permissions
    string requester_id = 3;
}

// Every credential linked to a user (Google, Discord, Passkey, Password).
message ListLinkedCredentialsRequest {
    string user_id = 1;
}

message ListLinkedCredentialsResponse {
    repeated Credential credentials = 1;
    repeated Passkey passkeys = 2;
}


service AuthService {
    // user lookup
    rpc GetUserAuth(GetUserAuthRequest) returns (GetUserAuthResponse);
    rpc CreateUserAuth(CreateUserAuthRequest) returns (CreateUserAuthResponse);
    rpc UpdateUserAuth(UpdateUserAuthRequest) returns (UpdateUserAuthResponse);

    // credential lookup
    rpc FindCredentialByProvider(FindCredentialByProviderRequest) returns (FindCredentialByProviderResponse);
    rpc FindPasskey(FindPasskeyRequest) returns (FindPasskeyResponse);
    rpc ListPasskeys(ListPasskeysRequest) returns (ListPasskeysResponse);
    rpc UpdatePasskeyCounter(UpdatePasskeyCounterRequest) returns (UpdatePasskeyCounterResponse);
    rpc RegisterPasskey(RegisterPasskeyRequest) returns (RegisterPasskeyResponse);
    rpc RevokePasskey(RevokePasskeyRequest) returns (google.protobuf.Empty);

    // account linking
    rpc LinkCredential(LinkCredentialRequest) returns (LinkCredentialResponse);
    rpc UnlinkCredential(UnlinkCredentialRequest) returns (google.protobuf.Empty);
    rpc ListLinkedCredentials(ListLinkedCredentialsRequest) returns (ListLinkedCredentialsResponse);
}
